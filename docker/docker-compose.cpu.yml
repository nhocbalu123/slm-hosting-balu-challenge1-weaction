services:
  ollama:
    image: ollama/ollama:latest
    container_name: balu-ollama-primary
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: balu-fastapi-wrapper-cpu
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      VLLM_BASE_URL: http://ollama:11434/v1
      VLLM_API_KEY: ollama
      VLLM_MODEL: qwen3.5:0.8b
      ENABLE_FALLBACK: "false"
      PRIMARY_TIMEOUT_SECONDS: 90
    depends_on:
      ollama:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()\nPY"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: balu-nginx-cpu
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ollama-data:
